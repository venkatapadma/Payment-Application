server:
  port: 8084

spring:
  application:
    name: reward-service

  datasource:
    url: jdbc:h2:mem:rewardDB
    driver-class-name: org.h2.Driver
    username: sa
    password:
  #    url: jdbc:mysql://localhost:3306/rewardDB
  #    username: root
  #    password: password123

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: reward-group
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring:
          deserializer:
            key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
            value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer

          json.value.default.type: com.paypal.reward_service.dto.TransactionEvent
          json.trusted.packages: com.paypal.reward_service.dto
