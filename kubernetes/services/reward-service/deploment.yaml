apiVersion: apps/v1
kind: Deployment
metadata:
  name: reward-service
  namespace: backend
  labels:
    app: reward-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reward-service
  template:
    metadata:
      name: reward-service
      labels:
        app: reward-service
    spec:
      containers:
        - name: reward-service
          image: reward-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
              protocol: TCP

          envFrom:
            - configMapRef:
                name: app-env
            - secretRef:
                name: jwt-secret

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      