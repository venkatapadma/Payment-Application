server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG

spring:
  application:
    name: api-gateway-service

  redis:
    host: localhost
    port: 6379

  cloud:
    gateway:
      server:
        webflux:
          #        user microservice
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path= /user-service/**
              filters:
                - StripPrefix= 1
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1

            #        Transaction microservice
            - id: transaction-service
              uri: http://localhost:8082
              predicates:
                - Path= /transaction-service/**
              filters:
                - StripPrefix= 1
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter-requestedToken: 1

              #        Notification microservice
            - id: notification-service
              uri: http://localhost:8083
              predicates:
                - Path=/notification-service/**
              filters:
                - StripPrefix= 1
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter-requestedToken: 1

            #        Reward microservice
            - id: reward-service
              uri: http://localhost:8084
              predicates:
                - Path=/reward-service/**
              filters:
                - StripPrefix= 1
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter-requestedToken: 1

            #            Wallet microservice
            - id: wallet-service
              uri: http://localhost:8085
              predicates:
                - Path= /wallet-service/**
              filters:
                - StripPrefix= 1
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter-requestedToken: 1

  httpclient:
    max-initial-line-length: 4096
    max-header-size: 8192
  filters:
    - name: RequestSize
      args:
        maxSize: 1MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: http://localhost:8080/user-service/v3/api-docs
      - name: transaction-service
        url: http://localhost:8080/transaction-service/v3/api-docs
      - name: wallet-service
        url: http://localhost:8080/wallet-service/v3/api-docs

#management:
#  endpoints:
#    web:
#      exposure:
#        include: "*"

  api-docs:
    enabled: true

