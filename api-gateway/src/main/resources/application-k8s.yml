server:
  port: 8080

spring:
  application:
    name: api-gateway-service

  redis:
    host: redis
    port: 6379

  cloud:
    gateway:
      routes:
        # User microservice
        - id: user-service
          uri: http://user-service:8080
          predicates:
            - Path=/user-service/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        # Transaction microservice
        - id: transaction-service
          uri: http://transaction-service:8080
          predicates:
            - Path=/transaction-service/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        # Notification microservice
        - id: notification-service
          uri: http://notification-service:8080
          predicates:
            - Path=/notification-service/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        # Reward microservice
        - id: reward-service
          uri: http://reward-service:8080
          predicates:
            - Path=/reward-service/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        # Wallet microservice
        - id: wallet-service
          uri: http://wallet-service:8080
          predicates:
            - Path=/wallet-service/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: /user-service/v3/api-docs
      - name: transaction-service
        url: /transaction-service/v3/api-docs
      - name: wallet-service
        url: /wallet-service/v3/api-docs
  api-docs:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.filter.ratelimit: DEBUG
    reactor.netty.http.client: WARN

security:
  jwt:
    secret: ${JWT_SECRET}
