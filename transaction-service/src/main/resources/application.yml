server:
  port: 8082

spring:
  application:
    name: transaction-service

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  datasource:
    url: jdbc:h2:mem:transactionDB
    username: sa
    password:
  #    url: jdbc:mysql://localhost:3306/transactionDB
  #    username: root
  #    password: password123

  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

api:
  gateway:
    base-url: http://localhost:8080/transaction-service

wallet.service.url: "http://localhost:8085"

security:
  jwt:
    secret: "y5x8ZrQF0V6pN8yM7A6e5zT2B3C1XvKpLkU2nH9Jc0A="
