networks:
  backend:
    driver: bridge
#secrets:
#  jwt_secret:
#    file: ./secret.txt

volumes:
  zk-data:
  zk-log:
  kafka_data:
  redis_data:

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zk-data:/var/lib/zookeeper/data
      - zk-log:/var/lib/zookeeper/log

    networks:
      - backend

  kafka:
    image: confluentinc/cp-kafka:7.4.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092, EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092, EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT, EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - backend

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend

  api-gateway:
    build: ./api-gateway
    image: api-gateway:1.0
    depends_on:
      - user-service
      - transaction-service
      - wallet-service
      - redis
    ports:
      - "8080:8080"
    env_file:
      - env.txt
    environment:
      JWT_SECRET: "y5x8ZrQF0V6pN8yM7A6e5zT2B3C1XvKpLkU2nH9Jc0A="
      SPRING_DATA_REDIS_URL: "redis://redis:6379"
    networks:
      - backend

  user-service:
    build: ./user-service
    image: user-service:1.0
    ports:
      - "8081:8081"
    env_file:
      - env.txt
#    secrets:
#      - jwt_secret
    environment:
      JWT_SECRET: "y5x8ZrQF0V6pN8yM7A6e5zT2B3C1XvKpLkU2nH9Jc0A="
    networks:
      - backend

  transaction-service:
    build: ./transaction-service
    image: transaction-service:1.0
    depends_on:
      - kafka
    env_file:
      - env.txt
    environment:
      JWT_SECRET: "y5x8ZrQF0V6pN8yM7A6e5zT2B3C1XvKpLkU2nH9Jc0A="
    ports:
      - "8082:8080"
    networks:
      - backend

  wallet-service:
    build: ./wallet-service
    image: wallet-service:1.0
    ports:
      - "8085:8085"
    env_file:
      - env.txt
    environment:
      JWT_SECRET: "y5x8ZrQF0V6pN8yM7A6e5zT2B3C1XvKpLkU2nH9Jc0A="
    networks:
      - backend

  notification-service:
    build: ./notification-service
    image: notification-service:1.0
    depends_on:
      - kafka
    env_file:
      - env.txt
    ports:
      - "8083:8080"
    networks:
      - backend

  reward-service:
    build: ./reward-service
    image: reward-service:1.0
    depends_on:
      - kafka
    env_file:
      - env.txt
    ports:
      - "8084:8080"
    networks:
      - backend
