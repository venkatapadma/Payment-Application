name: Build and Deploy API Gateway

on:
  push:
    paths:
      - 'reward-service/**'        # Trigger when files in reward-service folder changes

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      working-directory: reward-service
      run: mvn clean package

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build the Push the Docker Image
      uses: docker/build-push-action@v4
      with:
        context: reward-service
        file: reward-service/Dockerfile
        push: true
        tags: |
          venkatapadma26/reward-service:latest
          venkatapadma26/reward-service:${{ github.sha }}
